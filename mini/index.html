<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>NERV — Задания</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
  <div id="loading" class="loading">
    <div class="cyber-spinner"></div>
    <p>Подключение к NERV...</p>
  </div>

  <div id="error" class="error hidden">
    <h2>⚠️ Ошибка</h2>
    <p id="error-text">Не удалось подключиться</p>
    <button onclick="location.reload()">Повторить</button>
  </div>

  <main id="app" class="hidden">
    <header class="app-header">
      <div class="header-line">
        <span class="logo">⚡ NERV</span>
        <span class="user-tag" id="user-tag">—</span>
      </div>
    </header>

    <nav class="nav-tabs">
      <button class="tab active" data-tab="tasks">📋 Задания</button>
      <button class="tab" data-tab="profile">👤 Профиль</button>
      <button class="tab" data-tab="create">➕ Создать</button>
    </nav>

    <!-- ЗАДАНИЯ -->
    <section id="tab-tasks" class="tab-content active">
      <div class="filters" id="task-filters">
        <button class="filter active" data-filter="all">Все</button>
        <button class="filter" data-filter="open">🟢 Открытые</button>
        <button class="filter" data-filter="voting">🗳 Голосование</button>
        <button class="filter" data-filter="mine">📝 Мои</button>
      </div>

      <div id="tasks-list" class="tasks-list">
        <p class="placeholder">Загрузка заданий...</p>
      </div>
    </section>

    <!-- ПРОФИЛЬ -->
    <section id="tab-profile" class="tab-content">
      <div class="profile-header">
        <div class="avatar-wrap">
          <div class="avatar" id="profile-avatar">?</div>
          <div class="badge" id="profile-badge" style="display:none">🎖</div>
        </div>
        <h2 class="profile-name" id="profile-name">—</h2>
        <div class="profile-tags">
          <span class="tag tag-role" id="profile-role">—</span>
          <span class="tag tag-vip" id="profile-vip" style="display:none">💎 VIP</span>
          <span class="tag tag-mod" id="profile-mod" style="display:none">👮 Модератор</span>
        </div>
      </div>

      <div class="card">
        <div class="level-row">
          <div class="level-label">
            <span>🎖 Уровень <strong id="profile-level">1</strong></span>
            <span class="exp-info"><span id="profile-exp-progress">0</span>/<span id="profile-exp-needed">50</span> XP</span>
          </div>
          <div class="progress-bar">
            <div class="progress-fill" id="profile-exp-bar" style="width:0%"></div>
          </div>
        </div>
      </div>

      <div class="stats-grid">
        <div class="stat-card">
          <div class="stat-icon">💰</div>
          <div class="stat-value" id="profile-balance">0 ₽</div>
          <div class="stat-label">Баланс</div>
        </div>
        <div class="stat-card">
          <div class="stat-icon">⭐</div>
          <div class="stat-value" id="profile-reputation">0</div>
          <div class="stat-label">Репутация</div>
        </div>
        <div class="stat-card">
          <div class="stat-icon">🏅</div>
          <div class="stat-value" id="profile-rank">#—</div>
          <div class="stat-label">Место</div>
        </div>
        <div class="stat-card">
          <div class="stat-icon">🔥</div>
          <div class="stat-value" id="profile-streak">0 дн.</div>
          <div class="stat-label">Streak</div>
        </div>
      </div>

      <div class="card">
        <div class="card-row">
          <span>🎖 Достижения</span>
          <strong id="profile-achievements">0 / 10</strong>
        </div>
        <div class="card-row">
          <span>👥 Рефералы</span>
          <strong id="profile-referrals">0</strong>
        </div>
      </div>

      <div class="card referral-card">
        <div class="referral-label">🔗 Твой реферальный код</div>
        <div class="referral-code" id="profile-ref-code">—</div>
        <button class="btn-share" id="btn-share-ref">📤 Поделиться</button>
      </div>
    </section>

    <!-- СОЗДАТЬ -->
    <section id="tab-create" class="tab-content">
      <p class="placeholder">Создание заданий в разработке...</p>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
