<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <linearGradient id="nervGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00e5ff"/>
      <stop offset="1" stop-color="#ff00aa"/>
    </linearGradient>
    <linearGradient id="nervGrad2" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#ff00aa"/>
      <stop offset="1" stop-color="#00e5ff"/>
    </linearGradient>
    <filter id="nervGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="nervGlowSoft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Треугольник -->
  <polygon
    points="100,20 180,170 20,170"
    fill="none"
    stroke="url(#nervGrad)"
    stroke-width="2.5"
    stroke-linejoin="round"
    stroke-linecap="round"
    filter="url(#nervGlow)"
  />

  <!-- Усики (антенны) наверху -->
  <path
    d="M 88 55 Q 82 45 88 38"
    stroke="url(#nervGrad)"
    stroke-width="1.5"
    fill="none"
    stroke-linecap="round"
    filter="url(#nervGlowSoft)"
  />
  <path
    d="M 112 55 Q 118 45 112 38"
    stroke="url(#nervGrad)"
    stroke-width="1.5"
    fill="none"
    stroke-linecap="round"
    filter="url(#nervGlowSoft)"
  />

  <!-- Вертикальная центральная линия (правая сторона B) -->
  <line
    x1="100" y1="60" x2="100" y2="160"
    stroke="url(#nervGrad2)"
    stroke-width="2"
    stroke-linecap="round"
    filter="url(#nervGlow)"
  />

  <!-- Левый вертикальный бар (ствол B) -->
  <line
    x1="86" y1="60" x2="86" y2="160"
    stroke="url(#nervGrad2)"
    stroke-width="2"
    stroke-linecap="round"
    filter="url(#nervGlow)"
  />

  <!-- Верхняя дуга B -->
  <path
    d="M 86 60 L 100 60 Q 118 60 118 78 Q 118 96 100 96 L 86 96"
    stroke="url(#nervGrad2)"
    stroke-width="2"
    fill="none"
    stroke-linejoin="round"
    stroke-linecap="round"
    filter="url(#nervGlow)"
  />

  <!-- Нижняя дуга B -->
  <path
    d="M 86 96 L 100 96 Q 122 96 122 118 Q 122 160 86 160"
    stroke="url(#nervGrad2)"
    stroke-width="2"
    fill="none"
    stroke-linejoin="round"
    stroke-linecap="round"
    filter="url(#nervGlow)"
  />

  <!-- Центральная точка-акцент -->
  <circle cx="100" cy="96" r="2.5" fill="#00e5ff" filter="url(#nervGlow)"/>
</svg>